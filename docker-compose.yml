services:
  postgres:
    image: postgres:15-alpine
    container_name: lezhe-postgres
    restart: always
    environment:
      POSTGRES_USER: lezhe
      POSTGRES_PASSWORD: lezhepassword
      POSTGRES_DB: lezhe
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lezhe-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
